<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Test Client</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        input, button { margin: 5px; padding: 8px; }
        #messages { height: 300px; overflow-y: auto; border: 1px solid #ccc; padding: 10px; background: #f9f9f9; }
        .message { margin: 5px 0; padding: 5px; background: white; border-radius: 3px; }
        .error { color: red; }
        .success { color: green; }
        .info { color: blue; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Socket.IO Test Client</h1>
        
        <div class="section">
            <h3>Connection</h3>
            <input type="text" id="serverUrl" placeholder="Server URL" value="http://localhost:8000">
            <input type="text" id="authToken" placeholder="JWT Token (optional)">
            <button onclick="connect()">Connect</button>
            <button onclick="disconnect()">Disconnect</button>
            <div id="connectionStatus">Disconnected</div>
        </div>

        <div class="section">
            <h3>Room Management</h3>
            <input type="text" id="roomId" placeholder="Room ID">
            <button onclick="joinRoom()">Join Room</button>
            <button onclick="leaveRoom()">Leave Room</button>
        </div>

        <div class="section">
            <h3>Messaging</h3>
            <input type="text" id="messageText" placeholder="Message">
            <button onclick="sendMessage()">Send to Room</button>
            <br>
            <input type="text" id="targetUserId" placeholder="Target User ID">
            <button onclick="sendPrivateMessage()">Send Private Message</button>
        </div>

        <div class="section">
            <h3>Actions</h3>
            <button onclick="getOnlineUsers()">Get Online Users</button>
            <button onclick="getRoomMembers()">Get Room Members</button>
            <button onclick="startTyping()">Start Typing</button>
            <button onclick="stopTyping()">Stop Typing</button>
        </div>

        <div class="section">
            <h3>Messages</h3>
            <div id="messages"></div>
            <button onclick="clearMessages()">Clear Messages</button>
        </div>
    </div>

    <script>
        let socket = null;

        function addMessage(message, type = 'info') {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            messageDiv.innerHTML = `<strong>${new Date().toLocaleTimeString()}</strong>: ${message}`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function connect() {
            const serverUrl = document.getElementById('serverUrl').value;
            const authToken = document.getElementById('authToken').value;
            
            const options = {};
            if (authToken) {
                options.auth = { token: authToken };
            }

            socket = io(serverUrl, options);

            socket.on('connect', () => {
                document.getElementById('connectionStatus').textContent = 'Connected';
                addMessage('Connected to server', 'success');
            });

            socket.on('disconnect', (reason) => {
                document.getElementById('connectionStatus').textContent = 'Disconnected';
                addMessage(`Disconnected: ${reason}`, 'error');
            });

            socket.on('connect_error', (error) => {
                addMessage(`Connection error: ${error.message}`, 'error');
            });

            socket.on('receive_message', (data) => {
                addMessage(`Message from ${data.userId} in room ${data.roomId}: ${data.message}`, 'info');
            });

            socket.on('private_message', (data) => {
                addMessage(`Private message from ${data.fromUserId}: ${data.message}`, 'info');
            });

            socket.on('user_joined_room', (data) => {
                addMessage(`User ${data.userId} joined room ${data.roomId}`, 'info');
            });

            socket.on('user_left_room', (data) => {
                addMessage(`User ${data.userId} left room ${data.roomId}`, 'info');
            });

            socket.on('typing_status', (data) => {
                const status = data.isTyping ? 'started' : 'stopped';
                addMessage(`User ${data.userId} ${status} typing in room ${data.roomId}`, 'info');
            });

            socket.on('user_presence', (data) => {
                addMessage(`User ${data.userId} is now ${data.status}`, 'info');
            });
        }

        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
            }
        }

        function joinRoom() {
            const roomId = document.getElementById('roomId').value;
            if (!socket || !roomId) {
                addMessage('Please connect and enter a room ID', 'error');
                return;
            }

            socket.emit('join_room', { roomId }, (response) => {
                if (response.success) {
                    addMessage(`Successfully joined room: ${roomId}`, 'success');
                } else {
                    addMessage(`Failed to join room: ${response.message}`, 'error');
                }
            });
        }

        function leaveRoom() {
            const roomId = document.getElementById('roomId').value;
            if (!socket || !roomId) {
                addMessage('Please connect and enter a room ID', 'error');
                return;
            }

            socket.emit('leave_room', { roomId }, (response) => {
                if (response.success) {
                    addMessage(`Successfully left room: ${roomId}`, 'success');
                } else {
                    addMessage(`Failed to leave room: ${response.message}`, 'error');
                }
            });
        }

        function sendMessage() {
            const roomId = document.getElementById('roomId').value;
            const message = document.getElementById('messageText').value;
            if (!socket || !roomId || !message) {
                addMessage('Please connect, enter a room ID, and message', 'error');
                return;
            }

            socket.emit('send_message', { roomId, message }, (response) => {
                if (response.success) {
                    addMessage(`Message sent to room ${roomId}`, 'success');
                    document.getElementById('messageText').value = '';
                } else {
                    addMessage(`Failed to send message: ${response.message}`, 'error');
                }
            });
        }

        function sendPrivateMessage() {
            const targetUserId = document.getElementById('targetUserId').value;
            const message = document.getElementById('messageText').value;
            if (!socket || !targetUserId || !message) {
                addMessage('Please connect, enter target user ID, and message', 'error');
                return;
            }

            socket.emit('send_private_message', { targetUserId, message }, (response) => {
                if (response.success) {
                    addMessage(`Private message sent to user ${targetUserId}`, 'success');
                    document.getElementById('messageText').value = '';
                } else {
                    addMessage(`Failed to send private message: ${response.message}`, 'error');
                }
            });
        }

        function getOnlineUsers() {
            if (!socket) {
                addMessage('Please connect first', 'error');
                return;
            }

            socket.emit('get_online_users', (response) => {
                if (response.success) {
                    addMessage(`Online users: ${response.users.join(', ') || 'None'}`, 'success');
                } else {
                    addMessage(`Failed to get online users: ${response.message}`, 'error');
                }
            });
        }

        function getRoomMembers() {
            const roomId = document.getElementById('roomId').value;
            if (!socket || !roomId) {
                addMessage('Please connect and enter a room ID', 'error');
                return;
            }

            socket.emit('get_room_members', { roomId }, (response) => {
                if (response.success) {
                    addMessage(`Room ${roomId} members: ${response.members.join(', ') || 'None'}`, 'success');
                } else {
                    addMessage(`Failed to get room members: ${response.message}`, 'error');
                }
            });
        }

        function startTyping() {
            const roomId = document.getElementById('roomId').value;
            if (!socket || !roomId) {
                addMessage('Please connect and enter a room ID', 'error');
                return;
            }

            socket.emit('typing', { roomId, isTyping: true });
            addMessage('Started typing indicator', 'info');
        }

        function stopTyping() {
            const roomId = document.getElementById('roomId').value;
            if (!socket || !roomId) {
                addMessage('Please connect and enter a room ID', 'error');
                return;
            }

            socket.emit('typing', { roomId, isTyping: false });
            addMessage('Stopped typing indicator', 'info');
        }

        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
        }
    </script>
</body>
</html>
